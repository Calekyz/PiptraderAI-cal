  <body>
    <!-- ═══════════════════════════════════════════════════
         SPLASH LOADER — visible before React mounts
         Auto-fades when app is ready
         ═══════════════════════════════════════════════════ -->
    <div id="app-splash" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1a1035 0%, #0a0714 55%, #050308 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      transition: opacity 0.5s ease-out;
    ">
      <style>
        @keyframes splash-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes splash-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.85; transform: scale(1.05); }
        }
        @keyframes splash-dot {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40% { opacity: 1; transform: scale(1); }
        }
        @keyframes splash-fade {
          to { opacity: 0; visibility: hidden; }
        }
        .splash-logo {
          width: 64px; height: 64px;
          margin-bottom: 20px;
          border-radius: 16px;
          background: linear-gradient(135deg, #5b3fe4 0%, #7c3aed 100%);
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 0 40px rgba(124, 58, 237, 0.55), 0 0 80px rgba(91, 63, 228, 0.35);
          animation: splash-pulse 2s ease-in-out infinite;
        }
        .splash-logo svg { width: 32px; height: 32px; }
        .splash-title {
          font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
          background: linear-gradient(90deg, #a78bfa 0%, #c4b5fd 50%, #a78bfa 100%);
          -webkit-background-clip: text; background-clip: text;
          color: transparent; margin: 0 0 6px 0;
        }
        .splash-subtitle {
          font-size: 11px; color: #94a3b8; letter-spacing: 0.15em;
          text-transform: uppercase; font-weight: 600; margin: 0 0 32px 0;
        }
        .splash-dots { display: flex; gap: 8px; }
        .splash-dot {
          width: 8px; height: 8px; border-radius: 50%;
          background: #7c3aed;
          animation: splash-dot 1.4s ease-in-out infinite;
        }
        .splash-dot:nth-child(2) { animation-delay: 0.2s; }
        .splash-dot:nth-child(3) { animation-delay: 0.4s; }
      </style>

      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      </div>

      <h1 class="splash-title">PipTraderAI</h1>
      <p class="splash-subtitle">Institutional Trading Intelligence</p>

      <div class="splash-dots">
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ============================================ -->
    <!-- PWA: Service Worker Registration             -->
    <!-- ============================================ -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[PWA] Service worker registered at:', reg.scope);

              // Detect new version availability
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version available. Refresh to update.');
                  }
                });
              });
            })
            .catch((err) => {
              console.warn('[PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
